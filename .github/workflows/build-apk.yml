name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Save the dependency cache on every branch, not just the default one.
          cache-read-only: false

      # Bundle the StevenBlack ad/tracker/malware hosts list for the ad blocker.
      # (If the download fails the app falls back to a short built-in list.)
      - name: Download ad blocklist
        run: |
          mkdir -p app/src/full/assets
          curl -fsSL --retry 3 https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts \
            | awk '$1 == "0.0.0.0" && $2 != "0.0.0.0" { print $2 }' > app/src/full/assets/hosts.txt || true
          wc -l app/src/full/assets/hosts.txt || true

      # If the Play upload key is stored in repo secrets, use it to sign the Play bundle.
      - name: Load Play upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload key secret – Play bundle will be debug-signed (not uploadable)."
          fi

      - name: Build
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          NOSCROLL_SITE_URL: ${{ vars.NOSCROLL_SITE_URL }}
          NOSCROLL_GOOGLE_WEB_CLIENT_ID: ${{ vars.NOSCROLL_GOOGLE_WEB_CLIENT_ID }}
        run: |
          chmod +x gradlew
          # The runner ships with the Android SDK; just make sure licenses are accepted.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon assembleFullRelease assemblePlayRelease bundlePlayRelease
          cp app/build/outputs/apk/full/release/app-full-release.apk NoScroll.apk
          cp app/build/outputs/apk/play/release/app-play-release.apk NoScroll-play.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab NoScroll-play.aab

      # The Play Store version: upload NoScroll-play.aab in Play Console.
      - uses: actions/upload-artifact@v4
        with:
          name: NoScroll-play
          path: |
            NoScroll-play.aab
            NoScroll-play.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NoScroll-personal-apk
          path: NoScroll.apk

      # Publishes the APK at a stable link you can open on your phone:
      # https://github.com/<owner>/<repo>/releases/latest/download/NoScroll.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest NoScroll.apk \
            --target "$GITHUB_SHA" \
            --title "NoScroll (latest build)" \
            --notes "Personal build (all features unlocked, includes the ad blocker). Download NoScroll.apk on your Android phone and open it to install. The Google Play version is in this run's artifacts. Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}." \
            --latest
