name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          # The runner ships with the Android SDK; just make sure licenses are accepted.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk NoScroll.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NoScroll-apk
          path: NoScroll.apk

      # Publishes the APK at a stable link you can open on your phone:
      # https://github.com/<owner>/<repo>/releases/latest/download/NoScroll.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest NoScroll.apk \
            --target "$GITHUB_SHA" \
            --title "NoScroll (latest build)" \
            --notes "Download NoScroll.apk on your Android phone and open it to install. Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}." \
            --latest
